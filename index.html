<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Dexter's Cross-Country Run</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />

  <!-- Mapbox GL CSS -->
  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css"
    rel="stylesheet"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: #0b1020;
      color: #fff;
    }

    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }

    .overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      padding: 10px 14px;
      border-radius: 12px;
      z-index: 1;
      max-width: 280px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
    }

    .overlay h1 {
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: 700;
    }

    .overlay .sub {
      font-size: 13px;
      opacity: 0.9;
      line-height: 1.3;
    }

    .overlay #miles-text {
      font-weight: 600;
      display: block;
      margin-top: 4px;
    }

    .progress-bar {
      margin-top: 8px;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-inner {
      height: 100%;
      width: 0%;
      background: #ffd04a;
      transition: width 1s ease-out;
    }

    .status-text {
      margin-top: 6px;
      font-size: 12px;
      opacity: 0.9;
    }

    .hamster-marker {
      font-size: 28px;
      line-height: 1;
      transform: translateY(-4px);
    }

    .mapboxgl-ctrl-logo,
    .mapboxgl-ctrl-attrib {
      filter: invert(1) grayscale(1);
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="overlay">
    <h1>Dexter is running... 🐹</h1>
    <div class="sub">
      From Lake Placid, NY to Whiskerville, NV 
      <span id="miles-text">Loading miles…</span>
    </div>
    <div class="progress-bar">
      <div class="progress-bar-inner" id="progress-bar-inner"></div>
    </div>
    <div class="status-text" id="status-text">
      Fetching progress from Google Sheets…
    </div>
  </div>

  <!-- Mapbox GL JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
  <script>
    // 1) CONFIGURE THESE TWO VALUES

    // A. Your Mapbox access token
    mapboxgl.accessToken = "pk.eyJ1IjoiY3VydGlzaG93YXJkIiwiYSI6ImNtaWI1YnA5ZzE1MTkyanExdWg4dmc5MWEifQ.UeuMab1ki_KJpCB91dxpZw";

    // B. Public CSV export URL for your sheet
    //    Example:
    //    "https://docs.google.com/spreadsheets/d/XXXXX/export?format=csv&gid=0"
    const SHEET_CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vTdu2BBgNxkmkLfbIl_Z5QbySg9AKsesA3tbM5t95rmxEQaXMBakGipnxYdancyBEFdEfvBjTFQhrIn/pub?gid=0&single=true&output=csv"

    // 2) ROUTE CONFIG
    // Lake Placid, NY (approx) -> Whiskerville, NV
    // [lon, lat]
    const START = [-73.9849, 44.3215];     // Lake Placid
    const END   = [-118.793, 39.474];      // Whiskerville, NV

    // 3) HELPER FUNCTIONS

    function toRad(deg) {
      return (deg * Math.PI) / 180;
    }

    // Haversine distance between two [lon, lat] points in miles
    function haversineMiles(a, b) {
      const [lon1, lat1] = a;
      const [lon2, lat2] = b;
      const R = 3958.8; // Earth radius in miles

      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const lat1Rad = toRad(lat1);
      const lat2Rad = toRad(lat2);

      const sinDLat = Math.sin(dLat / 2);
      const sinDLon = Math.sin(dLon / 2);

      const h =
        sinDLat * sinDLat +
        Math.cos(lat1Rad) * Math.cos(lat2Rad) * sinDLon * sinDLon;

      const c = 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
      return R * c;
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function interpolateCoord(start, end, t) {
      return [lerp(start[0], end[0], t), lerp(start[1], end[1], t)];
    }

    // Sum the miles from the first column of the CSV.
    // Assumes optional header row (which is skipped if not numeric).
    async function getTotalMilesFromSheet() {
      const resp = await fetch(SHEET_CSV_URL);
      if (!resp.ok) {
        throw new Error("Failed to fetch sheet CSV");
      }

      const text = await resp.text();
      const lines = text.trim().split(/\r?\n/);

      let total = 0;
      for (let i = 0; i < lines.length; i++) {
        const cols = lines[i].split(",");
        const raw = cols[0]?.trim();
        if (!raw) continue;

        const value = parseFloat(raw);

        // Skip header row if first value is not a number
        if (i === 0 && Number.isNaN(value)) {
          continue;
        }

        if (!Number.isNaN(value)) {
          total += value;
        }
      }
      return total;
    }

    // 4) INITIALIZE MAP

    const map = new mapboxgl.Map({
      container: "map",
      style: "mapbox://styles/mapbox/dark-v11",
      center: [-90, 35], // Roughly central US
      zoom: 3
    });

    map.addControl(new mapboxgl.NavigationControl({ visualizePitch: true }));

    map.on("load", async () => {
      const milesTextEl = document.getElementById("miles-text");
      const progressBarInner = document.getElementById("progress-bar-inner");
      const statusTextEl = document.getElementById("status-text");

      // Draw full route as a straight line
      const fullRouteGeojson = {
        type: "FeatureCollection",
        features: [
          {
            type: "Feature",
            geometry: {
              type: "LineString",
              coordinates: [START, END]
            },
            properties: {}
          }
        ]
      };

      map.addSource("full-route", {
        type: "geojson",
        data: fullRouteGeojson
      });

      map.addLayer({
        id: "full-route-line",
        type: "line",
        source: "full-route",
        paint: {
          "line-color": "#888888",
          "line-width": 3,
          "line-dasharray": [2, 2]
        }
      });

      // Fit the map to show both endpoints
      const bounds = new mapboxgl.LngLatBounds();
      fullRouteGeojson.features[0].geometry.coordinates.forEach((coord) =>
        bounds.extend(coord)
      );
      map.fitBounds(bounds, {
        padding: { top: 80, bottom: 40, left: 40, right: 40 },
        duration: 0
      });

      let totalMiles;
      try {
        totalMiles = await getTotalMilesFromSheet();
      } catch (err) {
        console.error(err);
        milesTextEl.textContent = "Could not load miles.";
        statusTextEl.textContent =
          "Check that your sheet is published as CSV and accessible.";
        return;
      }

      const routeMiles = haversineMiles(START, END);
      const rawFraction = routeMiles > 0 ? totalMiles / routeMiles : 0;
      const fraction = Math.max(0, Math.min(1, rawFraction)); // clamp 0–1
      const progressCoord = interpolateCoord(START, END, fraction);

      const percent = Math.round(fraction * 100);

      milesTextEl.textContent = `${totalMiles.toFixed(
        1
      )} miles run (${percent}% of the way)`;

      if (fraction >= 1) {
        statusTextEl.textContent =
          "Dexter made it to Whiskerville, NV! 🎉🇲🇽";
      } else {
        const milesRemaining = Math.max(routeMiles - totalMiles, 0);
        statusTextEl.textContent = `About ${milesRemaining.toFixed(
          1
        )} miles to go.`;
      }

      // Animate the progress bar
      progressBarInner.style.width = `${fraction * 100}%`;

      // Progress line (from start to current hamster position)
      const progressGeojson = {
        type: "FeatureCollection",
        features: [
          {
            type: "Feature",
            geometry: {
              type: "LineString",
              coordinates: [START, progressCoord]
            },
            properties: {}
          }
        ]
      };

      map.addSource("progress-route", {
        type: "geojson",
        data: progressGeojson
      });

      map.addLayer({
        id: "progress-route-line",
        type: "line",
        source: "progress-route",
        paint: {
          "line-color": "#ffd04a",
          "line-width": 4
        }
      });

      // Hamster marker at current position
      // const markerEl = document.createElement("div");
      // markerEl.className = "hamster-marker";
      // markerEl.textContent = "🐹";
      const markerEl = document.createElement("div");
      markerEl.style.width = "40px";
      markerEl.style.height = "40px";
      markerEl.style.backgroundImage = "url('dexter.png')";
      markerEl.style.backgroundSize = "cover";
      markerEl.style.backgroundRepeat = "no-repeat";
      markerEl.style.backgroundPosition = "center";
      markerEl.style.borderRadius = "50%";

new mapboxgl.Marker(markerEl).setLngLat(progressCoord).addTo(map);


      new mapboxgl.Marker(markerEl).setLngLat(progressCoord).addTo(map);
    });
  </script>
</body>
</html>
